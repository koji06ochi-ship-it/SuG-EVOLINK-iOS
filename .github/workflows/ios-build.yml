name: EVOLINK iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evolink-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Standard public-repository runner. No larger runner, cache or artifacts.
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select installed Xcode 26 or later
        shell: bash
        run: |
          set -euo pipefail
          source scripts/select-xcode.sh
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build iOS Simulator without Apple signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project SuGEvolink.xcodeproj -scheme SuGEvolink \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/EVOLINK-DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/evolink-simulator-build.log"
          plist="$RUNNER_TEMP/EVOLINK-DerivedData/Build/Products/Debug-iphonesimulator/SuGEvolink.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = 'jp.sugosaka.evolink'
      - name: Archive iOS device build without Apple signing or upload
        shell: bash
        run: |
          set -euo pipefail
          result=0
          xcodebuild -project SuGEvolink.xcodeproj -scheme SuGEvolink \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EVOLINK.xcarchive" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/evolink-unsigned-archive.log" || result=$?
          find "$RUNNER_TEMP/EVOLINK.xcarchive" -maxdepth 5 -name Info.plist -print -exec plutil -p {} \;
          if [ "$result" -ne 0 ]; then
            app="$RUNNER_TEMP/EVOLINK.xcarchive/Products/Applications/SuGEvolink.app"
            codesign -d --verbose=4 "$app" 2>&1 || true
            swift -e 'import Foundation; let url=URL(fileURLWithPath:CommandLine.arguments[1]); print("Foundation bundle ID:", Bundle(url:url)?.bundleIdentifier ?? "UNREADABLE")' "$app" || true
          fi
          exit "$result"
      - name: Verify bundled runtime resources
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/EVOLINK.xcarchive/Products/Applications/SuGEvolink.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'jp.sugosaka.evolink'
          test ! -d "$app/Resources"
          cmp SuGEvolink/WebContent/EVOLINK_OFFLINE.html "$app/WebContent/EVOLINK_OFFLINE.html"
          test -s "$app/WebContent/native-files-bridge.js"
          test -s "$app/WebContent/native-health-bridge.js"
          swift -e 'import Foundation; let url=URL(fileURLWithPath:CommandLine.arguments[1]); guard let bundle=Bundle(url:url), bundle.bundleIdentifier == "jp.sugosaka.evolink", bundle.url(forResource:"EVOLINK_OFFLINE",withExtension:"html",subdirectory:"WebContent") != nil else { fatalError("Archive bundle/resource lookup failed") }; print("Foundation bundle and WebContent lookup succeeded")' "$app"
          echo 'Simulator build, unsigned device archive and exact HTML resource copy succeeded.'
          echo 'No Apple credentials, signing, upload, TestFlight or App Store submission performed.'
