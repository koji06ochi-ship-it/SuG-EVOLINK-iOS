name: EVOLINK existing-signature IPA preparation

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'EVOLINK build number (existing unsigned build is preserved)'
        required: true
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: evolink-signed-ipa
  cancel-in-progress: false

jobs:
  signed-ipa:
    if: github.repository == 'koji06ochi-ship-it/SuG-EVOLINK-iOS' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # Only for writer-visible draft IPA/archive outputs; never published.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EVOLINK_BUILD_NUMBER: ${{ inputs.build_number }}
      EVOLINK_ASC_KEY_ID: ${{ secrets.EVOLINK_ASC_KEY_ID }}
      EVOLINK_ASC_ISSUER_ID: ${{ secrets.EVOLINK_ASC_ISSUER_ID }}
      EVOLINK_ASC_PRIVATE_KEY_B64: ${{ secrets.EVOLINK_ASC_PRIVATE_KEY_B64 }}
      EVOLINK_DISTRIBUTION_P12_B64: ${{ secrets.EVOLINK_DISTRIBUTION_P12_B64 }}
      EVOLINK_P12_PASSWORD: ${{ secrets.EVOLINK_P12_PASSWORD }}
      EVOLINK_PROFILE_B64: ${{ secrets.EVOLINK_PROFILE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing GitHub signing secrets before any Apple request
        shell: bash
        run: |
          set -euo pipefail
          for key in EVOLINK_ASC_KEY_ID EVOLINK_ASC_ISSUER_ID EVOLINK_ASC_PRIVATE_KEY_B64 EVOLINK_DISTRIBUTION_P12_B64 EVOLINK_P12_PASSWORD EVOLINK_PROFILE_B64; do
            if [ -z "${!key}" ]; then echo "Missing GitHub Secret: $key"; exit 1; fi
          done
          case "$EVOLINK_BUILD_NUMBER" in ''|*[!0-9]*) echo 'Invalid EVOLINK build number'; exit 1 ;; esac
      - name: Use the already validated Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          source scripts/select-xcode.sh
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Install signing parser in the temporary runner environment
        id: crypto
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/evolink-signing-python"
          "$RUNNER_TEMP/evolink-signing-python/bin/python" -m pip install --quiet --disable-pip-version-check 'cryptography==50.0.2'
          echo "$RUNNER_TEMP/evolink-signing-python/bin" >> "$GITHUB_PATH"
      - name: Read existing Apple certificate/profile state and install only matched EVOLINK assets
        run: python scripts/evolink_signing.py prepare
      - name: Generate project and archive with the existing Apple Distribution identity
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project SuGEvolink.xcodeproj -scheme SuGEvolink \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EVOLINK-signed.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER=jp.sugosaka.evolink \
            CURRENT_PROJECT_VERSION="$EVOLINK_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$EVOLINK_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$EVOLINK_CERT_SHA1" \
            PROVISIONING_PROFILE_SPECIFIER="$EVOLINK_PROFILE_NAME" \
            archive
      - name: Verify actual archive signature and HealthKit entitlement
        run: python scripts/evolink_signing.py verify-archive
      - name: Export IPA locally without Apple upload
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EVOLINK-signed.xcarchive" \
            -exportPath "$RUNNER_TEMP/EVOLINK-ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/EVOLINK-ExportOptions.plist"
      - name: Verify exported IPA and recheck existing Apple signing state
        run: python scripts/evolink_signing.py verify-ipa
      - name: Preserve verified IPA and signed archive in an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/evolink_signing.py save-draft
      - name: Remove temporary runner copies without revoking Apple assets
        if: always() && steps.crypto.outcome == 'success'
        run: python scripts/evolink_signing.py cleanup
