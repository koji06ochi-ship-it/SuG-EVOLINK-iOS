name: SuGEvolink
options:
  minimumXcodeGenVersion: 2.42.0
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.0'
targets:
  SuGEvolink:
    type: application
    platform: iOS
    sources:
      - path: SuGEvolink/Sources
        excludes:
          - Info.plist
          - SuGEvolink.entitlements
      - path: SuGEvolink/Assets.xcassets
      - path: SuGEvolink/WebContent
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.sugosaka.evolink
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SuGEvolink/Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SuGEvolink/Sources/SuGEvolink.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
